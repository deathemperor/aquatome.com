name: moderate
# Comments and reader photos, nightly at 04:00 Vietnam time (was launchd). macOS for the face screen (Apple Vision).
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
jobs:
  moderate:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          engine: 'true'
      - run: pnpm engine moderate
