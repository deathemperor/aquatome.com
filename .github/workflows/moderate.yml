name: Comment and photo moderation
# Comments and reader photos, every hour, so a reader's photo shows within the hour instead of the next night. The
# moderation itself runs on macOS (Apple Vision's face screen), which the iOS jobs queue for too: a small Linux job asks
# the site whether anything waits, and macOS starts only when something does (or when it's run by hand).
# CLAUDE_ON_CI does not pause this: a comment or a photo waiting is still moderated.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
concurrency:
  group: moderate
  cancel-in-progress: false
jobs:
  waiting:
    name: Anything waiting?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.queues.outputs.count }}
    steps:
      - id: queues
        env:
          AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
        run: |
          # Each queue is a JSON array (comments, photos). One that can't be read counts as waiting, so a site error
          # never skips a run.
          n=0
          for q in /_c/admin/queue /_p/admin/queue; do
            c=$(curl -sf --retry 2 -H "Authorization: Bearer $AB_DASH_TOKEN" "https://aquatome.com$q" | jq 'length' 2>/dev/null) || c=1
            n=$((n + ${c:-1}))
          done
          echo "waiting: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"
  moderate:
    name: Moderate comments and reader photos
    needs: waiting
    if: github.event_name == 'workflow_dispatch' || needs.waiting.outputs.count != '0'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/engine-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - run: pnpm engine moderate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The owner's other Claude accounts, one token a line: the next when one is out (claude-accounts.ts).
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
          # A line a model call (claude.ts). Moderation has no ceiling (ceiling.ts), and its spend is on the record.
          ENGINE_COST_LOG: ${{ runner.temp }}/aquatome-cost-moderate.jsonl
      # Kept with the run: the rewrite brings these lines beside its own log at the start of a cycle (engine.yml), so
      # the day's total its backstop counts has moderation's spend in it.
      - name: Keep the cost log (a line a model call, with its account)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moderate-cost-log
          path: ${{ runner.temp }}/aquatome-cost-moderate.jsonl
          if-no-files-found: ignore
