name: moderate
# Comments and reader photos, nightly at 04:00 Vietnam time (was launchd). macOS for the face screen (Apple Vision).
on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:
jobs:
  moderate:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/engine-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - run: pnpm engine moderate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
