name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['content/**', 'sources/**', 'engine-state/**', 'docs/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm typecheck
      # Browser checks on the fixture build `pnpm test` left in apps/site/dist (apps/site/e2e/README.md).
      - run: pnpm --filter site exec playwright install --with-deps chromium
      - run: pnpm --filter site e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: apps/site/e2e-report
          if-no-files-found: ignore
