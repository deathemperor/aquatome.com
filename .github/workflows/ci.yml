name: Site checks (pull requests and main)
on:
  pull_request:
  workflow_dispatch: # fix.yml starts it on its branches (their PRs, opened with the workflow token, start nothing)
  push:
    branches: [main]
    paths-ignore: ['content/**', 'sources/**', 'engine-state/**', 'docs/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write # the AI review's comment
jobs:
  changes:
    name: Which checks this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.files.outputs.site }}
      review: ${{ steps.files.outputs.review }}
    steps:
      # A pull request that changes only the iOS app (apps/ios, its two workflows) skips the site's checks: ios.yml and
      # testflight.yml check it. protocols/ is the site's too. Anything else, or a list gh can't give (a diff of over 300
      # files), runs every check. The AI review runs on pull requests that change the site's code.
      - id: files
        name: Read the pull request's changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          site=true review=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && files="$(gh pr diff "$PR" -R "$GITHUB_REPOSITORY" --name-only)" && [ -n "$files" ]; then
            if ! grep -qvE '^(apps/ios/|\.github/workflows/(ios|testflight)\.yml$)' <<< "$files"; then site=false; fi
            if grep -q '^apps/site/src/' <<< "$files"; then review=true; fi
          fi
          echo "site checks: $site, AI review: $review"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "review=$review" >> "$GITHUB_OUTPUT"
  # A pull request says what it changes for readers, app users and the content, in its body's "## Changelog" section
  # (AGENTS.md, "Pull requests"; scripts/changelog.mjs): the daily report and the change log read it. The body is read as
  # it is now, not as the event had it, so a body fixed after the push passes when this job is run again. fix.yml's PRs
  # and the engine's content pass as they are; a push to main or a run started by hand has no PR, and passes.
  changelog:
    name: The pull request says its product change (## Changelog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # It runs the PR's own script: read only.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read the pull request's body and check its Changelog section
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json author,title,body,files | node scripts/changelog.mjs check
  checks:
    name: Unit tests, typecheck and browser checks
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node, pnpm and the dependencies
        uses: ./.github/actions/setup
      - name: Unit tests (and the fixture build, in apps/site/dist)
        run: pnpm test
      - name: Typecheck
        run: pnpm typecheck
      # Browser checks on the fixture build `pnpm test` left in apps/site/dist (apps/site/e2e/README.md).
      - name: Install Chromium for Playwright
        run: scripts/install-browser.sh chromium
      - name: Browser checks on the fixture build, as a phone and a computer
        run: pnpm --filter site e2e
      # What the owner's report draws, in the browser the owner's iPhone has. Chromium has none of its faults.
      - name: Install WebKit for Playwright
        run: scripts/install-browser.sh webkit
      - name: The owner's picture, as an iPhone
        run: pnpm --filter site e2e --project=iphone
        env:
          E2E_IPHONE: '1'
      # The AI page review (docs/governance.md, layer 3) on PRs that change the site's code: advisory, as a PR comment.
      # Only for this repository's branches (a fork's PR never sees the token).
      # CLAUDE_ON_CI=off pauses Claude in the workflows. Unset, or any other value, and this review runs.
      - id: review
        name: AI page review (pull requests that change apps/site/src)
        if: needs.changes.outputs.review == 'true' && github.event.pull_request.head.repo.full_name == github.repository && vars.CLAUDE_ON_CI != 'off'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The owner's other Claude accounts, one token a line: the next when one is out (claude-accounts.ts).
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
        run: |
          npm install -g @anthropic-ai/claude-code
          cd apps/site && E2E_REVIEW=1 E2E_JSON=review-results.json pnpm e2e --grep @review --project=phone || true
          echo ran=1 >> "$GITHUB_OUTPUT"
      - name: Post the review's findings on the pull request
        if: steps.review.outputs.ran == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/site-watch.mjs pr-comment apps/site/review-results.json "$PR" "$RUN_URL"
      - name: Keep the browser checks' report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: apps/site/e2e-report
          if-no-files-found: ignore
  # Lighthouse (PageSpeed's test) on the fixture build, beside the other checks: on a runner of its own, so its timings
  # measure the pages, not the other checks. Budgets: apps/site/e2e/lighthouse.spec.ts.
  lighthouse:
    name: Lighthouse budgets on the fixture build
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node, pnpm and the dependencies
        uses: ./.github/actions/setup
      # The build `pnpm test` makes, without the tests (they run in the other job).
      - name: Build the site from the fixture content
        working-directory: apps/site
        run: CONTENT_ROOT=$PWD/test/fixture-content pnpm build
      - name: Install Chromium for Playwright
        run: scripts/install-browser.sh chromium
      - name: Lighthouse, one page at a time
        run: pnpm --filter site e2e --grep @lighthouse --workers=1
        env:
          E2E_LIGHTHOUSE: '1'
      - name: Keep Lighthouse's report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: apps/site/e2e-report
          if-no-files-found: ignore
  # Before and after (docs/governance.md, rule 6 of every change), on PRs that change the site's code: the same pages of
  # the base's fixture build and this change's, at a phone's and a computer's size. The pairs that differ are the
  # `site-page-shots` artifact and the run's summary lists them. For the PR's author and reviewer: not part of `test`.
  shots:
    name: Before and after screenshots (pull requests that change apps/site/src)
    needs: changes
    if: needs.changes.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node, pnpm and the dependencies
        uses: ./.github/actions/setup
      - name: Build this change's site from the fixture content
        working-directory: apps/site
        run: CONTENT_ROOT=$PWD/test/fixture-content pnpm build
      - name: Build the base's site from its fixture content
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          git worktree add -q ../base FETCH_HEAD
          cd ../base && pnpm install --frozen-lockfile
          cd apps/site && CONTENT_ROOT=$PWD/test/fixture-content pnpm build
      - name: Install Chromium for Playwright
        run: scripts/install-browser.sh chromium
      - name: Screenshot the same pages of both
        working-directory: apps/site
        run: |
          node e2e/page-shots.mjs ../../../base/apps/site/dist dist page-shots
          cat page-shots/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the pairs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-page-shots
          path: apps/site/page-shots
  # The check main's ruleset requires, by this exact name: green when every site check passed, or when the change is
  # iOS-only and they were skipped, and the PR's Changelog section reads well. A failed or cancelled check, or a failed
  # `changes`, fails it.
  test:
    needs: [changes, checks, lighthouse, changelog]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every site check passed (or the change is iOS-only)
        env:
          CHANGES: ${{ needs.changes.result }}
          SITE: ${{ needs.changes.outputs.site }}
          CHECKS: ${{ needs.checks.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
          CHANGELOG: ${{ needs.changelog.result }}
        run: |
          echo "changes: $CHANGES, site checks needed: $SITE, checks: $CHECKS, lighthouse: $LIGHTHOUSE, changelog: $CHANGELOG"
          [ "$CHANGELOG" = success ] || { echo "The PR body's Changelog section: see the changelog job for what to add."; exit 1; }
          [ "$CHANGES" = success ] || exit 1
          if [ "$SITE" = true ]; then
            [ "$CHECKS" = success ] && [ "$LIGHTHOUSE" = success ] || exit 1
          else
            [ "$CHECKS" = skipped ] && [ "$LIGHTHOUSE" = skipped ] || exit 1
          fi
