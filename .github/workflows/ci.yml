name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['content/**', 'sources/**', 'engine-state/**', 'docs/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm typecheck
