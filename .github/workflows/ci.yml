name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['content/**', 'sources/**', 'engine-state/**', 'docs/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm typecheck
