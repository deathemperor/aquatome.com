name: ci
on:
  pull_request:
  workflow_dispatch: # fix.yml starts it on its branches (their PRs, opened with the workflow token, start nothing)
  push:
    branches: [main]
    paths-ignore: ['content/**', 'sources/**', 'engine-state/**', 'docs/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write # the AI review's comment
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm test
      - run: pnpm typecheck
      # Browser checks on the fixture build `pnpm test` left in apps/site/dist (apps/site/e2e/README.md).
      - run: pnpm --filter site exec playwright install --with-deps chromium
      - run: pnpm --filter site e2e
      # Lighthouse (PageSpeed's test) on the same build, alone: next to other checks its timings measure them. Budgets:
      # apps/site/e2e/lighthouse.spec.ts.
      - run: pnpm --filter site e2e --grep @lighthouse --workers=1
        env:
          E2E_LIGHTHOUSE: '1'
      # The AI page review (docs/governance.md, layer 3) on PRs that change the site's code: advisory, as a PR comment.
      # Only for this repository's branches (a fork's PR never sees the token).
      - id: review
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if gh pr diff "$PR" --name-only | grep -q '^apps/site/src/'; then
            npm install -g @anthropic-ai/claude-code
            cd apps/site && E2E_REVIEW=1 E2E_JSON=review-results.json pnpm e2e --grep @review --project=phone || true
            echo ran=1 >> "$GITHUB_OUTPUT"
          fi
      - if: steps.review.outputs.ran == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/site-watch.mjs pr-comment apps/site/review-results.json "$PR" "$RUN_URL"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: apps/site/e2e-report
          if-no-files-found: ignore
  # TEMPORARY (removed before merge): Lighthouse on the real build on GitHub's runners, to set the budgets.
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm --filter site exec playwright install --with-deps chromium
      - working-directory: apps/site
        run: |
          I18N_LENIENT=1 PUBLIC_BUILD=1 SITE_URL=https://aquatome.com pnpm build > /dev/null
          E2E_LIGHTHOUSE=1 pnpm exec playwright test --grep @lighthouse --workers=1 || true
