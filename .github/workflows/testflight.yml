name: "iOS app: TestFlight upload"
# The iOS app, signed and uploaded to TestFlight, whose internal group "Owner" gets every build by itself. Signing is
# Xcode's automatic, cloud-managed signing with the App Store Connect API key: no certificate or profile in the
# repository. A pull request that changes signing signs and exports without uploading.
on:
  push:
    branches: [main]
    paths: ['apps/ios/**', 'protocols/**', '.github/workflows/testflight.yml']
  schedule:
    # Mondays 09:00 in Vietnam: uploads when the app changed since the last upload (or that build nears TestFlight's 90
    # days). Main itself moves every few hours with content, so the check compares the app's paths, not commits.
    - cron: '0 2 * * 1'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/testflight.yml', 'apps/ios/AquaTome.xcodeproj/**', 'apps/ios/Config/**',
            'apps/ios/scripts/asc-build-state.mjs', 'apps/ios/scripts/testflight-notes.py']
concurrency:
  # One upload at a time, and never one stopped halfway.
  group: ${{ github.event_name == 'pull_request' && format('testflight-pr-{0}', github.event.pull_request.number) || 'testflight' }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  check:
    name: "iOS app: decide whether to upload"
    runs-on: ubuntu-latest
    outputs:
      upload: ${{ steps.decide.outputs.upload }}
      whats_new: ${{ steps.notes.outputs.whats_new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The last run on main whose upload job succeeded: its commit and when. The job was named "upload" until
      # 2026-11-02. Read by the Monday check below and for the build's "What to Test".
      - id: last
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=""
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/testflight.yml/runs?branch=main&status=success&per_page=50" \
            --jq '.workflow_runs[] | select(.event != "pull_request") | "\(.id),\(.head_sha),\(.created_at)"'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%%,*}/jobs" \
              --jq '.jobs[] | select((.name == "upload" or .name == "iOS app: sign and upload to TestFlight") and .conclusion == "success") | .id' | grep -q .; then last=$run; break; fi
          done
          echo "run=$last" >> "$GITHUB_OUTPUT"
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          LAST: ${{ steps.last.outputs.run }}
        run: |
          if [ "$EVENT" != schedule ]; then echo upload=yes >> "$GITHUB_OUTPUT"; exit 0; fi
          sha=$(echo "$LAST" | cut -d, -f2)
          days=$(( ($(date +%s) - $(date -d "$(echo "$LAST" | cut -d, -f3 | grep . || echo 1970-01-01T00:00:00Z)" +%s)) / 86400 ))
          # A failed fetch or diff uploads (a spare build is harmless; a missing one isn't).
          if [ -n "$sha" ] && [ "$days" -lt 60 ] && git fetch -q --depth=1 origin "$sha" &&
            git diff --quiet "$sha" "$GITHUB_SHA" -- apps/ios protocols .github/workflows/testflight.yml; then
            echo "the app is unchanged since the upload $days days ago: nothing new"
            echo upload=no >> "$GITHUB_OUTPUT"
          else
            echo upload=yes >> "$GITHUB_OUTPUT"
          fi
      # TestFlight's "What to Test" for this build: the pull requests merged into the app since the last upload, in
      # English as their titles are (apps/ios/scripts/testflight-notes.py). A pull request checks the script only.
      # Never stops an upload: a note that can't be written is a warning, and the build goes up without one.
      - id: notes
        env:
          EVENT: ${{ github.event_name }}
          LAST: ${{ steps.last.outputs.run }}
        run: |
          if ! python3 apps/ios/scripts/testflight-notes.py --test; then
            [ "$EVENT" != pull_request ] || exit 1
            echo "::warning title=What to Test::the note's own test failed; the build goes up without one"; exit 0
          fi
          [ "$EVENT" != pull_request ] || exit 0
          since=$(echo "$LAST" | cut -d, -f2)
          if { [ -z "$since" ] || [ "$(git rev-parse --is-shallow-repository)" = false ] ||
            git fetch -q --filter=blob:none --unshallow origin; } &&
            text=$(python3 apps/ios/scripts/testflight-notes.py "$since"); then
            end=$(openssl rand -hex 8)
            printf 'whats_new<<%s\n%s\n%s\n' "$end" "$text" "$end" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$text"
          else
            echo "::warning title=What to Test::the note couldn't be written; the build goes up without one"
          fi
  upload:
    # The weekly check above finds the last upload by this name: change both together.
    name: "${{ github.event_name == 'pull_request' && 'iOS app: sign and export, not uploaded' || 'iOS app: sign and upload to TestFlight' }}"
    needs: check
    # Secrets don't reach a fork's pull request: those have nothing to sign with.
    if: >-
      needs.check.outputs.upload == 'yes' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 100
    env:
      KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      DESTINATION: ${{ github.event_name == 'pull_request' && 'export' || 'upload' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: App Store Connect key
        env:
          P8: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          umask 077
          printf '%s\n' "$P8" > "$RUNNER_TEMP/asc.p8"
      # The build number is this workflow's run number, so it always goes up.
      # Not signed by Apple here: signing a build needs a certificate whose private key is on this machine, and a fresh
      # runner has none, so automatic signing made a new Apple Development certificate on every run until Apple's cap
      # stopped the archive (2026-10-31). The export below signs for the App Store with Apple's cloud-managed
      # certificate. The app's entitlements go with it in an ad-hoc signature, which the export reads and keeps.
      - name: Archive
        run: |
          xcodebuild archive -project apps/ios/AquaTome.xcodeproj -scheme AquaTome -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/AquaTome.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO
          codesign --force --sign - --entitlements apps/ios/Config/AquaTome.entitlements --generate-entitlement-der \
            "$RUNNER_TEMP/AquaTome.xcarchive/Products/Applications/AquaTome.app"
      # Signed for the App Store into a local .ipa first, every time: only a local export writes the summary the
      # entitlement check reads (run 41221088161 uploaded, then found no summary).
      - name: Sign
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string export "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert teamID -string "$TEAM_ID" "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AquaTome.xcarchive" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      # The signed app has every entitlement the project asks for (Sign in with Apple): an export that dropped one
      # would ship an app whose sign-in fails. Checked before anything is uploaded. Notifications' APNs is the
      # project's `development` (Xcode's builds) and the App Store's `production`.
      - name: Entitlements kept
        run: |
          python3 - "$RUNNER_TEMP/export/DistributionSummary.plist" apps/ios/Config/AquaTome.entitlements <<'EOF'
          import plistlib, sys
          summary, wanted = (plistlib.load(open(p, 'rb')) for p in sys.argv[1:])
          if 'aps-environment' in wanted: wanted['aps-environment'] = 'production'
          signed = [i.get('entitlements', {}) for items in summary.values() for i in items]
          missing = sorted({k for e in signed for k, v in wanted.items() if e.get(k) != v}) if signed else ['(no app in the summary)']
          if missing: sys.exit(f'entitlements missing from the signed app: {missing}')
          print('entitlements kept:', ', '.join(wanted))
          EOF
      # The same export, sent to App Store Connect (pull requests stop at the check above).
      - name: Upload to TestFlight
        if: env.DESTINATION == 'upload'
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          plutil -replace destination -string upload "$options"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/AquaTome.xcarchive" -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/upload" -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Summary
        run: echo "Build ${{ github.run_number }} ($DESTINATION) done" >> "$GITHUB_STEP_SUMMARY"
      # Apple processes an upload before testers get it, and refuses some only then (by email): wait for its answer.
      - name: Wait for App Store Connect
        env:
          APP_ID: '6829188547'
          # A dry run only reports the newest build (it checks the key and the script), and sets no note.
          BUILD: ${{ env.DESTINATION == 'upload' && github.run_number || '' }}
          WHATS_NEW: ${{ needs.check.outputs.whats_new }}
        run: KEY_PATH="$RUNNER_TEMP/asc.p8" node apps/ios/scripts/asc-build-state.mjs
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
