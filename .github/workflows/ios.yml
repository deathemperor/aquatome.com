name: "iOS app: build and tests"
# The iOS app (apps/ios): its Chihiros protocol and tank store code are checked against the vectors the site uses
# (protocols/).
# A draft pull request holds no macOS runner: its jobs run once it's marked ready (ready_for_review), then on each
# push. The site's engine shares the account's few macOS runners, and every push to a draft queued five jobs ahead of
# it (2026-11-03: an engine cycle waited over 2 hours behind 8 iOS runs).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['apps/ios/**', 'protocols/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['apps/ios/**', 'protocols/**', '.github/workflows/ios.yml']
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# The flows of the handbook and of what a tank reads from it (its fish, plants and guides, the tank-mates check), run by
# job `handbook`; job `app` runs every other flow but the lights'. One list for both, so a class misspelled here still
# runs, in `app`. A class the app doesn't have runs nothing. Keep at least one: an empty list leaves a bare
# -only-testing:AquaTomeUITests/ and -skip-testing:AquaTomeUITests/ in the commands below.
env:
  HANDBOOK_FLOWS: >-
    HandbookFlowTests FactsCardFlowTests ReadingFlowTests NativePageFlowTests OfflineFlowTests TankCheckFlowTests
    TankLifeFlowTests PageShotsFlowTests TelemetryFlowTests
  # The handbook flows' first half, run by `handbook (1)` with the page shots; `handbook (2)` runs the rest of
  # HANDBOOK_FLOWS, so a class added there later runs in it. Split by their times on #400's run of 2026-11-03 (the
  # whole job past its hour): 1,647 s here, 1,182 s in the rest before the tank volume flows' 605 s join it.
  HANDBOOK_FLOWS_FIRST: >-
    NativePageFlowTests PageShotsFlowTests FactsCardFlowTests ReadingFlowTests TankCheckFlowTests
  # The light flows' first half, run by `lights (1)`; `lights (2)` runs the rest of LightFlowTests, so a flow added later
  # or misspelled here runs there. Split by their times on main's run of 2026-11-01 (1,034 s and 1,017 s).
  LIGHT_FLOWS_FIRST: >-
    testADroppedLightConnectsAgainWithoutAScan testALightThatDropsMidTestIsKeptAsSetByHandUntilTheoLich
    testALightThatDropsWhileBeingReadCanBeConnectedAgain
    testASavedLightIsListedAfterARelaunchAndConnectsWithWhatWasWritten testDisconnectGoesBackToFindingLights
    testDisconnectWhileReadingTheLightReportsNothing testLeavingTheAppPutsATestColourBackOnTheScheduleWithOneFrame
    testOldFirmwareCannotWriteSchedules testRenamesAndForgetsTheLight
    testSchedulesWrittenAreListedOnlyWhileTheLightIsConnected testTheDayPreviewStopsAtOnceOnTheScreenAndOnTheLight
    testTheLightsOwnScheduleIsNeverShownAsWhatItRuns testThePlanIsKeptWithoutALight
    testTheWriteBarStaysInViewAndSaysWhatWillBeWritten testWritesAPresetThenAnotherThenUndoesBackToTheFirst
    testWritingAScheduleEndsTheManualLevels
jobs:
  # Whether a pull request is ready (a draft runs nothing on macOS), and which of the two long flow jobs it needs
  # (apps/ios/scripts/flows-to-run.py says how it decides): a change the lights' flows can't reach doesn't hold a macOS
  # runner for them, which the site's engine shares. Jobs `kit` and `app` run on every ready pull request, and main
  # runs everything after a merge.
  changes:
    name: "iOS app: which flows this change needs"
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.pick.outputs.ready }}
      handbook: ${{ steps.pick.outputs.handbook }}
      lights: ${{ steps.pick.outputs.lights }}
    steps:
      # A pull request is checked out as its merge with main: its first parent is main, so the diff is its change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # bash as `shell:` fails on any part of the pipe (pipefail): a script or diff that breaks fails the job, rather
      # than leaving both flow jobs skipped on a green run. A moved file is listed at both ends (--no-renames), and a
      # path with Vietnamese letters as itself (quotePath).
      - id: pick
        shell: bash
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          python3 apps/ios/scripts/flows-to-run.py --test
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            printf 'ready=true\nhandbook=true\nlights=true\n' | tee -a "$GITHUB_OUTPUT"
          elif [ "$DRAFT" = true ]; then
            printf 'ready=false\nhandbook=false\nlights=false\n' | tee -a "$GITHUB_OUTPUT"
            echo "::notice title=Draft::the iOS jobs run once this pull request is marked ready"
          else
            echo ready=true | tee -a "$GITHUB_OUTPUT"
            git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD |
              python3 apps/ios/scripts/flows-to-run.py | tee -a "$GITHUB_OUTPUT"
          fi
  kit:
    name: "iOS kit: unit tests"
    needs: changes
    if: needs.changes.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Everything builds (the Bluetooth module and the light harness have no tests of their own: the harness is
      # run by hand against a real light), then the tests run.
      - run: swift build && swift test
        working-directory: apps/ios/AquaTomeKit
  app:
    name: "iOS app: other flows, strings, performance and size"
    needs: changes
    if: needs.changes.outputs.ready == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apps/ios/scripts/wait-for-simulator.sh
      # The main flows (apps/ios/AquaTomeUITests), but the handbook's (job `handbook`) and the lights' (job `lights`), and
      # the App Store's screenshots (app-store.yml), which read the live site.
      # A failed test runs once more, as the site's journeys do on CI: the simulator on these runners sometimes stops
      # answering for 30 s, then drops the next tap or loses the app (PRs #234, #248 on 2026-10-31, in their
      # recordings). A test that fails twice fails the job; one that passed only on its retry is flagged below.
      - run: >-
          xcodebuild test -project apps/ios/AquaTome.xcodeproj -scheme AquaTome
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -derivedDataPath build/dd -resultBundlePath build/ui.xcresult CODE_SIGNING_ALLOWED=NO
          -test-timeouts-enabled YES -default-test-execution-time-allowance 600
          -retry-tests-on-failure -test-iterations 2 -skip-testing:AquaTomeUITests/PerformanceTests
          -skip-testing:AquaTomeUITests/LightFlowTests -skip-testing:AquaTomeUITests/StoreShotsFlowTests
          $(printf -- '-skip-testing:AquaTomeUITests/%s ' $HANDBOOK_FLOWS)
      # Flaky tests are seen, not hidden: each one that needed its retry is a warning on the run and in its summary.
      - name: Tests that passed only on a retry
        if: always()
        run: apps/ios/scripts/retried-tests.py build/ui.xcresult
      # Every string the app shows is translated into Indonesian and Thai.
      - run: python3 apps/ios/scripts/check-strings.py build/dd
      # What the app costs a reader (apps/ios/perf-budgets.json): launch, the work and memory of a long list, its size.
      # Measured apart from the flows above, so a flow's retry never touches a measurement. Budgets are checked in
      # code, not in an Xcode .xcbaseline: a baseline belongs to one machine model, and on hosted runners it would
      # stop applying, silently, the day the machines change.
      - name: Performance tests
        run: >-
          xcodebuild test-without-building -project apps/ios/AquaTome.xcodeproj -scheme AquaTome
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -derivedDataPath build/dd -resultBundlePath build/perf.xcresult CODE_SIGNING_ALLOWED=NO
          -only-testing:AquaTomeUITests/PerformanceTests
      # The app's size as it goes to the App Store: an archive (Release, for iPhones, stripped), unsigned here.
      - name: Archive
        run: >-
          xcodebuild archive -project apps/ios/AquaTome.xcodeproj -scheme AquaTome -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/AquaTome.xcarchive -derivedDataPath build/release
          CODE_SIGNING_ALLOWED=NO
      - name: Performance budgets
        run: python3 apps/ios/scripts/check-perf.py build/perf.xcresult build/AquaTome.xcarchive/Products/Applications/AquaTome.app
      # A budget only tightens: this pull request's budgets against main's.
      - name: Budgets only tighten
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
          if git cat-file -e FETCH_HEAD:apps/ios/perf-budgets.json 2>/dev/null; then
            git show FETCH_HEAD:apps/ios/perf-budgets.json > "$RUNNER_TEMP/budgets-main.json"
            python3 apps/ios/scripts/check-perf.py --tightens-only "$RUNNER_TEMP/budgets-main.json"
          else
            echo "main has no budgets yet"
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-tests
          path: |
            build/ui.xcresult
            build/perf.xcresult
          if-no-files-found: ignore
  # The handbook's flows (HANDBOOK_FLOWS, above): on their own runners, beside jobs `app` and `lights`. On 2026-11-01
  # `app` ran out of its hour on a slow runner, in the performance tests after 52 minutes of flows (15 of them the
  # build), with only the facts card added to main; the handbook stack (#313 to #341) adds more. Then this job alone
  # took 53 to 58 minutes on every pull request of 2026-11-03, and ran out of its hour with the tank volume flows
  # (#400): in two halves since, as the light flows are.
  handbook:
    # No matrix value in the name: Actions adds "(1)" and "(2)", and a skipped job then reads as a plain name.
    name: "iOS app: handbook and tank-life flows"
    needs: changes
    if: needs.changes.outputs.handbook == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        half: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apps/ios/scripts/wait-for-simulator.sh
      # Retried once, as in job `app`, and for the same reason.
      - run: |
          if [ "${{ matrix.half }}" = 1 ]; then
            flows=$HANDBOOK_FLOWS_FIRST
          else
            # Not in a $(…): the runner's bash 3.2 reads a case's `)` there as the end of it.
            flows=
            for f in $HANDBOOK_FLOWS; do
              case " $HANDBOOK_FLOWS_FIRST " in *" $f "*) ;; *) flows="$flows $f" ;; esac
            done
          fi
          xcodebuild test -project apps/ios/AquaTome.xcodeproj -scheme AquaTome \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -derivedDataPath build/dd -resultBundlePath build/handbook.xcresult CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -retry-tests-on-failure -test-iterations 2 $(printf -- '-only-testing:AquaTomeUITests/%s ' $flows)
      - name: Tests that passed only on a retry
        if: always()
        run: apps/ios/scripts/retried-tests.py build/handbook.xcresult
      # The pages' screenshots (PageShotsFlowTests, in the first half), a pull request's before (its base's run) or
      # after (its own): see docs/governance.md.
      - name: Page screenshots
        if: always() && matrix.half == 1
        run: apps/ios/scripts/shots.py build/handbook.xcresult build/shots
      - if: always() && matrix.half == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-page-shots
          path: build/shots
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-handbook-flows-${{ matrix.half }}
          path: build/handbook.xcresult
          if-no-files-found: ignore
  # The light flows on the simulator's fake light, which answers like the real one (with its pauses, so each flow takes
  # a minute or more): on two runners, beside jobs `app` and `handbook`. One runner outgrew its hour on 2026-11-01 (#312:
  # 58 minutes of flows, 37 of them the lights'), then the lights alone reached 51 minutes on a slow runner (#315).
  lights:
    # No matrix value in the name: Actions adds "(1)" and "(2)", and a skipped job then reads as a plain name.
    name: "iOS app: light flows"
    needs: changes
    if: needs.changes.outputs.lights == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        half: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: apps/ios/scripts/wait-for-simulator.sh
      # Retried once, as in job `app`, and for the same reason. A test that hangs (an app launch that never finished
      # held a runner for 53 minutes on #314) is stopped after ten minutes, as in the other flow jobs: the longest flow
      # takes under three on CI.
      - run: |
          if [ "${{ matrix.half }}" = 1 ]; then
            only=$(printf -- '-only-testing:AquaTomeUITests/LightFlowTests/%s ' $LIGHT_FLOWS_FIRST)
          else
            only="-only-testing:AquaTomeUITests/LightFlowTests $(printf -- '-skip-testing:AquaTomeUITests/LightFlowTests/%s ' $LIGHT_FLOWS_FIRST)"
          fi
          xcodebuild test -project apps/ios/AquaTome.xcodeproj -scheme AquaTome \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -derivedDataPath build/dd -resultBundlePath build/lights.xcresult CODE_SIGNING_ALLOWED=NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 \
            -retry-tests-on-failure -test-iterations 2 $only
      - name: Tests that passed only on a retry
        if: always()
        run: apps/ios/scripts/retried-tests.py build/lights.xcresult
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-light-flows-${{ matrix.half }}
          path: build/lights.xcresult
          if-no-files-found: ignore
