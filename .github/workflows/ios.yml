name: ios
# The iOS app (apps/ios): its Chihiros protocol and tank store code are checked against the vectors the site uses
# (protocols/).
on:
  pull_request:
    paths: ['apps/ios/**', 'protocols/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['apps/ios/**', 'protocols/**', '.github/workflows/ios.yml']
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  kit:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Everything builds (the Bluetooth module and the light harness have no tests of their own: the harness is
      # run by hand against a real light), then the tests run.
      - run: swift build && swift test
        working-directory: apps/ios/AquaTomeKit
  app:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Some runners don't list the simulator yet when the job starts: xcodebuild then stops at once with "Unable to find
      # a device matching the provided destination specifier", on the same image a passing run used (twice on
      # 2026-10-31). Wait for it, up to two minutes; the list goes in the log if it never shows.
      - run: |
          for i in $(seq 1 24); do
            xcrun simctl list devices available -j | jq -e '[.devices | to_entries[] | select(.key | endswith("iOS-26-5")) | .value[] | select(.name == "iPhone 17")] | length > 0' >/dev/null && exit 0
            sleep 5
          done
          xcrun simctl list devices available
          exit 1
      # The main flows (apps/ios/AquaTomeUITests) on the simulator's fake light, which answers like the real one.
      # A failed test runs once more, as the site's journeys do on CI: the simulator on these runners sometimes stops
      # answering for 30 s, then drops the next tap or loses the app (PRs #234, #248 on 2026-10-31, in their
      # recordings). A test that fails twice fails the job; one that passed only on its retry is flagged below.
      - run: >-
          xcodebuild test -project apps/ios/AquaTome.xcodeproj -scheme AquaTome
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -derivedDataPath build/dd -resultBundlePath build/ui.xcresult CODE_SIGNING_ALLOWED=NO
          -retry-tests-on-failure -test-iterations 2 -skip-testing:AquaTomeUITests/PerformanceTests
      # Flaky tests are seen, not hidden: each one that needed its retry is a warning on the run and in its summary.
      - name: Tests that passed only on a retry
        if: always()
        run: |
          [ -d build/ui.xcresult ] || exit 0
          xcrun xcresulttool get test-results tests --path build/ui.xcresult | python3 -c '
          import json, os, sys
          def walk(n, path):
              runs = [c for c in n.get("children", []) if c.get("nodeType") == "Repetition"]
              if n.get("nodeType") == "Test Case" and n.get("result") == "Passed" and any(r.get("result") == "Failed" for r in runs):
                  name = "/".join(path + [n["name"]])
                  print(f"::warning title=Passed only on a retry::{name}")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f: f.write(f"- passed only on a retry: `{name}`\n")
              for c in n.get("children", []): walk(c, path + ([n["name"]] if n.get("nodeType") == "Test Suite" else []))
          for t in json.load(sys.stdin)["testNodes"]: walk(t, [])
          '
      # Every string the app shows is translated into Indonesian and Thai.
      - run: python3 apps/ios/scripts/check-strings.py build/dd
      # What the app costs a reader (apps/ios/perf-budgets.json): launch, the work and memory of a long list, its size.
      # Measured apart from the flows above, so a flow's retry never touches a measurement. Budgets are checked in
      # code, not in an Xcode .xcbaseline: a baseline belongs to one machine model, and on hosted runners it would
      # stop applying, silently, the day the machines change.
      - name: Performance tests
        run: >-
          xcodebuild test-without-building -project apps/ios/AquaTome.xcodeproj -scheme AquaTome
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -derivedDataPath build/dd -resultBundlePath build/perf.xcresult CODE_SIGNING_ALLOWED=NO
          -only-testing:AquaTomeUITests/PerformanceTests
      # The app's size as it goes to the App Store: an archive (Release, for iPhones, stripped), unsigned here.
      - name: Archive
        run: >-
          xcodebuild archive -project apps/ios/AquaTome.xcodeproj -scheme AquaTome -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/AquaTome.xcarchive -derivedDataPath build/release
          CODE_SIGNING_ALLOWED=NO
      - name: Performance budgets
        run: python3 apps/ios/scripts/check-perf.py build/perf.xcresult build/AquaTome.xcarchive/Products/Applications/AquaTome.app
      # A budget only tightens: this pull request's budgets against main's.
      - name: Budgets only tighten
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
          if git cat-file -e FETCH_HEAD:apps/ios/perf-budgets.json 2>/dev/null; then
            git show FETCH_HEAD:apps/ios/perf-budgets.json > "$RUNNER_TEMP/budgets-main.json"
            python3 apps/ios/scripts/check-perf.py --tightens-only "$RUNNER_TEMP/budgets-main.json"
          else
            echo "main has no budgets yet"
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-tests
          path: |
            build/ui.xcresult
            build/perf.xcresult
          if-no-files-found: ignore
