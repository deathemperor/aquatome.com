name: "iOS app: build and tests"
# The iOS app (apps/ios): its Chihiros protocol and tank store code are checked against the vectors the site uses
# (protocols/).
# A draft pull request holds no macOS runner: its jobs run once it's marked ready (ready_for_review), then on each
# push. The site's engine shares the account's few macOS runners, and every push to a draft queued five jobs ahead of
# it (2026-11-03: an engine cycle waited over 2 hours behind 8 iOS runs).
on:
  pull_request:
    # `labeled`: the label `ios-full` runs every flow (job `changes`). Any other label runs the pull request again as a
    # push would, in its group: a run with every job skipped would hide the last one's results in `gh pr checks`, which
    # lists each name once. Labels are rare here.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths: ['apps/ios/**', 'protocols/**', '.github/workflows/ios.yml']
  push:
    branches: [main]
    paths: ['apps/ios/**', 'protocols/**', '.github/workflows/ios.yml']
  # Every flow each night on main, whatever changed: 02:30 in Vietnam. Not `perf`: main's push measured the same code.
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:
# A pull request's newer run (a push, a label) cancels its run in progress. Main's runs, nightly or by hand, each have a
# group of their own, so none is cancelled, nor dropped while waiting (a group keeps one run waiting and cancels any
# before it): every merge's run finishes.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('ios-{0}', github.ref) || format('ios-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # Whether a pull request is ready (a draft runs nothing on macOS), and which flows each flow job runs: the full suite
  # on main, nightly, by hand and on a pull request labelled `ios-full`; on any other pull request, the smoke set and
  # the flows its change can reach (apps/ios/scripts/flows-to-run.py says how it decides). A job with no flows to run
  # is skipped, and doesn't hold a Mac. Jobs `kit` and `perf` run on every ready pull request.
  changes:
    name: "iOS app: which flows this change needs"
    runs-on: ubuntu-latest
    # `actions: read`: the markers of jobs that passed (step `passed`).
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.pick.outputs.ready }}
      app: ${{ steps.pick.outputs.app }}
      handbook: ${{ steps.pick.outputs.handbook }}
      handbook_1: ${{ steps.pick.outputs.handbook_1 }}
      handbook_2: ${{ steps.pick.outputs.handbook_2 }}
      lights: ${{ steps.pick.outputs.lights }}
      lights_1: ${{ steps.pick.outputs.lights_1 }}
      lights_2: ${{ steps.pick.outputs.lights_2 }}
      runner: ${{ steps.where.outputs.runner }}
      key_kit: ${{ steps.passed.outputs.key_kit }}
      passed_kit: ${{ steps.passed.outputs.passed_kit }}
      key_perf: ${{ steps.passed.outputs.key_perf }}
      passed_perf: ${{ steps.passed.outputs.passed_perf }}
      key_app: ${{ steps.passed.outputs.key_app }}
      passed_app: ${{ steps.passed.outputs.passed_app }}
      key_handbook_1: ${{ steps.passed.outputs.key_handbook_1 }}
      passed_handbook_1: ${{ steps.passed.outputs.passed_handbook_1 }}
      key_handbook_2: ${{ steps.passed.outputs.key_handbook_2 }}
      passed_handbook_2: ${{ steps.passed.outputs.passed_handbook_2 }}
      key_lights_1: ${{ steps.passed.outputs.key_lights_1 }}
      passed_lights_1: ${{ steps.passed.outputs.passed_lights_1 }}
      key_lights_2: ${{ steps.passed.outputs.key_lights_2 }}
      passed_lights_2: ${{ steps.passed.outputs.passed_lights_2 }}
    steps:
      # A pull request is checked out as its merge with main: its first parent is main, so the diff is its change.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # bash as `shell:` fails on any part of the pipe (pipefail): a script or diff that breaks fails the job, rather
      # than leaving the flow jobs skipped on a green run. A moved file is listed at both ends (--no-renames), and a
      # path with Vietnamese letters as itself (quotePath).
      - id: pick
        shell: bash
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          FULL: ${{ contains(github.event.pull_request.labels.*.name, 'ios-full') }}
        run: |
          python3 apps/ios/scripts/flows-to-run.py --test
          python3 apps/ios/scripts/passed-before.py --test
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$DRAFT" = true ]; then
            printf 'ready=false\napp=\nhandbook=[]\nlights=[]\n' | tee -a "$GITHUB_OUTPUT"
            echo "::notice title=Draft::the iOS jobs run once this pull request is marked ready"
          elif [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$FULL" = true ]; then
            echo ready=true | tee -a "$GITHUB_OUTPUT"
            python3 apps/ios/scripts/flows-to-run.py --full | tee -a "$GITHUB_OUTPUT"
          else
            echo ready=true | tee -a "$GITHUB_OUTPUT"
            git -c core.quotePath=false diff --no-renames --name-only HEAD^1 HEAD |
              python3 apps/ios/scripts/flows-to-run.py | tee -a "$GITHUB_OUTPUT"
            echo "::notice title=Some flows::the smoke set and the flows this change can reach; ios-full runs them all"
          fi
      # Where jobs `app`, `handbook` and `lights` run: the repository's own Mac (label `aquatome`,
      # apps/ios/README.md) for main (a push, the nightly run, a run by hand) and for pull requests its owner opened from
      # this repository's own branches, while the repository variable IOS_LOCAL_RUNNER is "on"; GitHub's Macs otherwise.
      # The Mac has two runners (aquatome-mac-1 and -2, each with its own simulator), so its jobs take turns two at a
      # time. Jobs `kit` and `perf` stay on GitHub's Macs. This only routes: a fork's pull request runs its own copy of this file,
      # so what keeps others' code off that Mac is the runner's own job-started hook, outside the repository.
      - id: where
        env:
          LOCAL: >-
            ${{ vars.IOS_LOCAL_RUNNER == 'on' &&
            ((github.ref == 'refs/heads/main' && contains(fromJSON('["push", "schedule", "workflow_dispatch"]'),
            github.event_name)) ||
            (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            github.event.pull_request.user.login == github.repository_owner)) }}
        run: |
          if [ "$LOCAL" = true ]; then echo 'runner=["self-hosted","macOS","aquatome"]'; else echo 'runner="macos-26"'; fi |
            tee -a "$GITHUB_OUTPUT"
      # The jobs that already passed on this code, with the same flows, on the same runner and toolchain
      # (apps/ios/scripts/passed-before.py): each runs on Linux as a stand-in that says where it passed, and holds no
      # Mac. A pull request rebased for a conflict in the docs, or pushed again with the app as it was, tests nothing
      # again (2026-11-05: 25% of the own Mac's day went to runs a later push replaced, most of them rebases for one
      # row of docs/governance.md).
      - id: passed
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
          REF: ${{ github.ref }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          # Bumped by hand after the own Mac's Xcode or simulator runtime is updated (apps/ios/README.md).
          EPOCH: ${{ vars.IOS_PASSED_EPOCH }}
          READY: ${{ steps.pick.outputs.ready }}
          RUNNER: ${{ steps.where.outputs.runner }}
          APP: ${{ steps.pick.outputs.app }}
          HANDBOOK: ${{ steps.pick.outputs.handbook }}
          HANDBOOK_1: ${{ steps.pick.outputs.handbook_1 }}
          HANDBOOK_2: ${{ steps.pick.outputs.handbook_2 }}
          LIGHTS: ${{ steps.pick.outputs.lights }}
          LIGHTS_1: ${{ steps.pick.outputs.lights_1 }}
          LIGHTS_2: ${{ steps.pick.outputs.lights_2 }}
        run: python3 apps/ios/scripts/passed-before.py --find
  # On GitHub's Macs: a minute of `swift build` and `swift test`, with no simulator. On the own Mac it waited behind the
  # flows for that minute, a median of three hours (2026-11-04 to 05).
  kit:
    name: "iOS kit: unit tests"
    needs: changes
    if: needs.changes.outputs.ready == 'true'
    runs-on: ${{ needs.changes.outputs.passed_kit && 'ubuntu-latest' || 'macos-26' }}
    env:
      PASSED: ${{ needs.changes.outputs.passed_kit }}
      PASS_KEY: ${{ needs.changes.outputs.key_kit }}
    timeout-minutes: 20
    steps:
      # Passed before on this code (job `changes`, step `passed`): nothing to run again.
      - name: Passed before
        if: env.PASSED != ''
        run: echo "Passed on this code in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PASSED, not run again."
      - if: env.PASSED == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Everything builds (the Bluetooth module and the light harness have no tests of their own: the harness is
      # run by hand against a real light), then the tests run.
      - if: env.PASSED == ''
        run: swift build && swift test
        working-directory: apps/ios/AquaTomeKit
      # Passed: a marker for a later run of the same code (passed-before.py). One that can't be written is a warning,
      # and leaves the job as it passed.
      - id: mark
        continue-on-error: true
        if: >-
          success() && env.PASSED == '' && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if python3 apps/ios/scripts/passed-before.py --mark "$PASS_KEY" >> "$GITHUB_OUTPUT"; then
            touch "$RUNNER_TEMP/passed"
          else
            echo "::warning title=Passed before::no marker written: a later run of this code runs this job again"
          fi
      - if: steps.mark.outputs.key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/passed
          key: ${{ steps.mark.outputs.key }}
  app:
    name: "iOS app: other flows"
    needs: changes
    if: needs.changes.outputs.app != ''
    runs-on: ${{ needs.changes.outputs.passed_app && 'ubuntu-latest' || fromJSON(needs.changes.outputs.runner) }}
    env:
      PASSED: ${{ needs.changes.outputs.passed_app }}
      PASS_KEY: ${{ needs.changes.outputs.key_app }}
    timeout-minutes: 60
    steps:
      # Passed before on this code (job `changes`, step `passed`): nothing to run again.
      - name: Passed before
        if: env.PASSED != ''
        run: echo "Passed on this code in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PASSED, not run again."
      - if: env.PASSED == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.PASSED == ''
        run: apps/ios/scripts/wait-for-simulator.sh
      # The full suite: the main flows (apps/ios/AquaTomeUITests), but the handbook's (job `handbook`) and the lights'
      # (job `lights`), the performance tests (job `perf`), and the App Store's screenshots (app-store.yml), which read
      # the live site. A pull request: the smoke set, and the flows its change can reach that are none of those.
      # A failed test runs once more, as the site's journeys do on CI: the simulator on these runners sometimes stops
      # answering for 30 s, then drops the next tap or loses the app (PRs #234, #248 on 2026-10-31, in their
      # recordings). A test that fails twice fails the job; one that passed only on its retry is flagged below.
      # `exec`: xcodebuild takes the step's place, so a cancelled job's stop signals reach it. Run under the step's
      # shell, it was left running with no parent when that shell died, still driving the simulator and writing its
      # result bundle into the next job's checkout (2026-11-04, the runner's log; wait-for-simulator.sh).
      - if: env.PASSED == ''
        env:
          TESTS: ${{ needs.changes.outputs.app }}
        run: >-
          exec xcodebuild test -project apps/ios/AquaTome.xcodeproj -scheme AquaTome
          -destination "${AQ_CI_DEST:-platform=iOS Simulator,name=iPhone 17,OS=26.5}"
          -derivedDataPath build/dd -resultBundlePath build/ui.xcresult CODE_SIGNING_ALLOWED=NO
          -test-timeouts-enabled YES -default-test-execution-time-allowance 600
          -retry-tests-on-failure -test-iterations 2 $TESTS
      # Flaky tests are seen, not hidden: each one that needed its retry is a warning on the run and in its summary.
      - name: Tests that passed only on a retry
        if: always() && env.PASSED == ''
        run: apps/ios/scripts/retried-tests.py build/ui.xcresult
      - name: The own Mac's simulator shut down
        if: always() && env.PASSED == ''
        run: apps/ios/scripts/wait-for-simulator.sh --done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ui-tests
          path: build/ui.xcresult
          if-no-files-found: ignore
      # Passed: a marker for a later run of the same code (passed-before.py). One that can't be written is a warning,
      # and leaves the job as it passed.
      - id: mark
        continue-on-error: true
        if: >-
          success() && env.PASSED == '' && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if python3 apps/ios/scripts/passed-before.py --mark "$PASS_KEY" >> "$GITHUB_OUTPUT"; then
            touch "$RUNNER_TEMP/passed"
          else
            echo "::warning title=Passed before::no marker written: a later run of this code runs this job again"
          fi
      - if: steps.mark.outputs.key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/passed
          key: ${{ steps.mark.outputs.key }}
  # What the app costs a reader (apps/ios/perf-budgets.json): launch, the work and memory of a long list, its size. On
  # GitHub's Macs always: the budgets are CI's readings there ×1.1, and the repository's own Mac, much faster, would pass
  # a regression unseen. Measured apart from the flows, so a flow's retry never touches a measurement. Budgets are
  # checked in code, not in an Xcode .xcbaseline: a baseline belongs to one machine model, and on hosted runners it
  # would stop applying, silently, the day the machines change. The translations are checked here too, from this
  # job's build: it runs on every ready pull request, and a flow job may not.
  perf:
    name: "iOS app: performance, size and strings"
    needs: changes
    if: needs.changes.outputs.ready == 'true' && github.event_name != 'schedule'
    runs-on: ${{ needs.changes.outputs.passed_perf && 'ubuntu-latest' || 'macos-26' }}
    env:
      PASSED: ${{ needs.changes.outputs.passed_perf }}
      PASS_KEY: ${{ needs.changes.outputs.key_perf }}
    timeout-minutes: 40
    steps:
      # Passed before on this code (job `changes`, step `passed`): nothing to run again.
      - name: Passed before
        if: env.PASSED != ''
        run: echo "Passed on this code in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PASSED, not run again."
      - if: env.PASSED == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.PASSED == ''
        run: apps/ios/scripts/wait-for-simulator.sh
      - name: Performance tests
        if: env.PASSED == ''
        run: >-
          xcodebuild test -project apps/ios/AquaTome.xcodeproj -scheme AquaTome
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5'
          -derivedDataPath build/dd -resultBundlePath build/perf.xcresult CODE_SIGNING_ALLOWED=NO
          -only-testing:AquaTomeUITests/PerformanceTests
      # Every string the app shows is translated into Indonesian and Thai.
      - name: Translations
        if: env.PASSED == ''
        run: python3 apps/ios/scripts/check-strings.py build/dd
      # The app's size as it goes to the App Store: an archive (Release, for iPhones, stripped), unsigned here.
      - name: Archive
        if: env.PASSED == ''
        run: >-
          xcodebuild archive -project apps/ios/AquaTome.xcodeproj -scheme AquaTome -configuration Release
          -destination 'generic/platform=iOS' -archivePath build/AquaTome.xcarchive -derivedDataPath build/release
          CODE_SIGNING_ALLOWED=NO
      - name: Performance budgets
        if: env.PASSED == ''
        run: python3 apps/ios/scripts/check-perf.py build/perf.xcresult build/AquaTome.xcarchive/Products/Applications/AquaTome.app
      # A budget only tightens: this pull request's budgets against main's.
      - name: Budgets only tighten
        if: github.event_name == 'pull_request' && env.PASSED == ''
        run: |
          git fetch -q --depth=1 origin "$GITHUB_BASE_REF"
          if git cat-file -e FETCH_HEAD:apps/ios/perf-budgets.json 2>/dev/null; then
            git show FETCH_HEAD:apps/ios/perf-budgets.json > "$RUNNER_TEMP/budgets-main.json"
            python3 apps/ios/scripts/check-perf.py --tightens-only "$RUNNER_TEMP/budgets-main.json"
          else
            echo "main has no budgets yet"
          fi
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-perf
          path: build/perf.xcresult
          if-no-files-found: ignore
      # Passed: a marker for a later run of the same code (passed-before.py). One that can't be written is a warning,
      # and leaves the job as it passed.
      - id: mark
        continue-on-error: true
        if: >-
          success() && env.PASSED == '' && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if python3 apps/ios/scripts/passed-before.py --mark "$PASS_KEY" >> "$GITHUB_OUTPUT"; then
            touch "$RUNNER_TEMP/passed"
          else
            echo "::warning title=Passed before::no marker written: a later run of this code runs this job again"
          fi
      - if: steps.mark.outputs.key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/passed
          key: ${{ steps.mark.outputs.key }}
  # The handbook's flows (HANDBOOK in flows-to-run.py): on their own runners, beside jobs `app` and `lights`. On 2026-11-01
  # `app` ran out of its hour on a slow runner, in the performance tests after 52 minutes of flows (15 of them the
  # build), with only the facts card added to main; the handbook stack (#313 to #341) adds more. Then this job alone
  # took 53 to 58 minutes on every pull request of 2026-11-03, and ran out of its hour with the tank volume flows
  # (#400): in two halves since, as the light flows are. On a pull request, a half runs only the flows its change can
  # reach that are in that half, and a half with none is left out (`halves` in flows-to-run.py).
  handbook:
    # No matrix value in the name: Actions adds "(1)" and "(2)", and a skipped job then reads as a plain name.
    name: "iOS app: handbook and tank-life flows"
    needs: changes
    if: needs.changes.outputs.handbook != '[]'
    runs-on: ${{ needs.changes.outputs[format('passed_handbook_{0}', matrix.half)] && 'ubuntu-latest' || fromJSON(needs.changes.outputs.runner) }}
    env:
      PASSED: ${{ needs.changes.outputs[format('passed_handbook_{0}', matrix.half)] }}
      PASS_KEY: ${{ needs.changes.outputs[format('key_handbook_{0}', matrix.half)] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        half: ${{ fromJSON(needs.changes.outputs.handbook) }}
    steps:
      # Passed before on this code (job `changes`, step `passed`): nothing to run again.
      - name: Passed before
        if: env.PASSED != ''
        run: echo "Passed on this code in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PASSED, not run again."
      - if: env.PASSED == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.PASSED == ''
        run: apps/ios/scripts/wait-for-simulator.sh
      # Retried once, as in job `app`, and for the same reason.
      - if: env.PASSED == ''
        env:
          TESTS: ${{ needs.changes.outputs[format('handbook_{0}', matrix.half)] }}
        # `exec`, as in job `app`.
        run: >-
          exec xcodebuild test -project apps/ios/AquaTome.xcodeproj -scheme AquaTome
          -destination "${AQ_CI_DEST:-platform=iOS Simulator,name=iPhone 17,OS=26.5}"
          -derivedDataPath build/dd -resultBundlePath build/handbook.xcresult CODE_SIGNING_ALLOWED=NO
          -test-timeouts-enabled YES -default-test-execution-time-allowance 600
          -retry-tests-on-failure -test-iterations 2 $TESTS
      - name: Tests that passed only on a retry
        if: always() && env.PASSED == ''
        run: apps/ios/scripts/retried-tests.py build/handbook.xcresult
      - name: The own Mac's simulator shut down
        if: always() && env.PASSED == ''
        run: apps/ios/scripts/wait-for-simulator.sh --done
      # The pages' screenshots (PageShotsFlowTests, in the first half), a pull request's before (main's run) or after
      # (its own): see docs/governance.md. Only when this half ran them.
      - name: Page screenshots
        if: always() && matrix.half == 1 && contains(needs.changes.outputs.handbook_1, '/PageShotsFlowTests') && env.PASSED == ''
        run: apps/ios/scripts/shots.py build/handbook.xcresult build/shots
      - if: always() && matrix.half == 1 && contains(needs.changes.outputs.handbook_1, '/PageShotsFlowTests') && env.PASSED == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-page-shots
          path: build/shots
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-handbook-flows-${{ matrix.half }}
          path: build/handbook.xcresult
          if-no-files-found: ignore
      # Passed: a marker for a later run of the same code (passed-before.py). One that can't be written is a warning,
      # and leaves the job as it passed.
      - id: mark
        continue-on-error: true
        if: >-
          success() && env.PASSED == '' && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if python3 apps/ios/scripts/passed-before.py --mark "$PASS_KEY" >> "$GITHUB_OUTPUT"; then
            touch "$RUNNER_TEMP/passed"
          else
            echo "::warning title=Passed before::no marker written: a later run of this code runs this job again"
          fi
      - if: steps.mark.outputs.key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/passed
          key: ${{ steps.mark.outputs.key }}
  # The light flows on the simulator's fake light, which answers like the real one (with its pauses, so each flow takes
  # a minute or more): in two halves, beside jobs `app` and `handbook`. One runner outgrew its hour on 2026-11-01 (#312:
  # 58 minutes of flows, 37 of them the lights'), then the lights alone reached 51 minutes on a slow runner (#315). On
  # a pull request, as in job `handbook`, a half runs only the light flows its change can reach.
  lights:
    # No matrix value in the name: Actions adds "(1)" and "(2)", and a skipped job then reads as a plain name.
    name: "iOS app: light flows"
    needs: changes
    if: needs.changes.outputs.lights != '[]'
    runs-on: ${{ needs.changes.outputs[format('passed_lights_{0}', matrix.half)] && 'ubuntu-latest' || fromJSON(needs.changes.outputs.runner) }}
    env:
      PASSED: ${{ needs.changes.outputs[format('passed_lights_{0}', matrix.half)] }}
      PASS_KEY: ${{ needs.changes.outputs[format('key_lights_{0}', matrix.half)] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        half: ${{ fromJSON(needs.changes.outputs.lights) }}
    steps:
      # Passed before on this code (job `changes`, step `passed`): nothing to run again.
      - name: Passed before
        if: env.PASSED != ''
        run: echo "Passed on this code in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PASSED, not run again."
      - if: env.PASSED == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.PASSED == ''
        run: apps/ios/scripts/wait-for-simulator.sh
      # Retried once, as in job `app`, and for the same reason. A test that hangs (an app launch that never finished
      # held a runner for 53 minutes on #314) is stopped after ten minutes, as in the other flow jobs: the longest flow
      # takes under three on CI.
      - if: env.PASSED == ''
        env:
          TESTS: ${{ needs.changes.outputs[format('lights_{0}', matrix.half)] }}
        # `exec`, as in job `app`.
        run: >-
          exec xcodebuild test -project apps/ios/AquaTome.xcodeproj -scheme AquaTome
          -destination "${AQ_CI_DEST:-platform=iOS Simulator,name=iPhone 17,OS=26.5}"
          -derivedDataPath build/dd -resultBundlePath build/lights.xcresult CODE_SIGNING_ALLOWED=NO
          -test-timeouts-enabled YES -default-test-execution-time-allowance 600
          -retry-tests-on-failure -test-iterations 2 $TESTS
      - name: Tests that passed only on a retry
        if: always() && env.PASSED == ''
        run: apps/ios/scripts/retried-tests.py build/lights.xcresult
      - name: The own Mac's simulator shut down
        if: always() && env.PASSED == ''
        run: apps/ios/scripts/wait-for-simulator.sh --done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-light-flows-${{ matrix.half }}
          path: build/lights.xcresult
          if-no-files-found: ignore
      # Passed: a marker for a later run of the same code (passed-before.py). One that can't be written is a warning,
      # and leaves the job as it passed.
      - id: mark
        continue-on-error: true
        if: >-
          success() && env.PASSED == '' && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if python3 apps/ios/scripts/passed-before.py --mark "$PASS_KEY" >> "$GITHUB_OUTPUT"; then
            touch "$RUNNER_TEMP/passed"
          else
            echo "::warning title=Passed before::no marker written: a later run of this code runs this job again"
          fi
      - if: steps.mark.outputs.key != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/passed
          key: ${{ steps.mark.outputs.key }}
