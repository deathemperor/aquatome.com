name: Auto-fix from an issue
# Layer 4 of docs/governance.md: one recorded problem (an issue) → Claude reproduces it as a failing check and fixes it →
# a separate job runs every check on the change → a draft PR that fixes the issue, with CI started on it. Merging stays a
# review. Started by scripts/site-watch.mjs when it opens a site-check issue, by the "autofix" label, or by hand.
#
# Three jobs keep the agent's work away from write access: `agent` holds only the Claude token and hands over a patch;
# `verify` runs the patched code with no secrets; `publish` holds the write token but runs no repository code, only the
# publish script as it is on main, and refuses patches to the workflows or to the fix and watch scripts.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number'
        required: true
  issues:
    types: [labeled]
concurrency:
  group: fix-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
permissions: {}
env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}
jobs:
  agent:
    name: Claude reproduces and fixes the issue (read-only token)
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'autofix'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node, pnpm and the dependencies
        uses: ./.github/actions/setup
      - name: Install Chromium for Playwright, and Claude
        run: pnpm --filter site exec playwright install --with-deps chromium && npm install -g @anthropic-ai/claude-code
      - name: Read the issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "not an issue number: $ISSUE"; exit 1; }
          gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json number,title,body,labels \
            --jq '"# #\(.number) \(.title)\n\nLabels: \([.labels[].name] | join(", "))\n\n\(.body)"' > ISSUE.md
      - name: Build the fixture site for the agent to start from
        run: pnpm test > /tmp/fixture-build.log 2>&1 || true # the agent starts from a built fixture site
      - name: Claude reproduces the problem and fixes it
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
        # The owner's Claude accounts in turn (CLAUDE_CODE_OAUTH_TOKENS, one token a line; else CLAUDE_CODE_OAUTH_TOKEN), as
        # the engine does (claude-accounts.ts): the next one only when the agent stopped on this one's usage limit or its
        # token was rejected, from a clean tree. The last answer stands.
        run: |
          schema='{"type":"object","required":["status","summary"],"additionalProperties":false,"properties":{"status":{"enum":["fixed","not-reproduced","needs-person"]},"summary":{"type":"string"},"check":{"type":"string"}}}'
          out='hit your .*limit|usage limit|limit reached|rate.?limit|Failed to authenticate|Invalid bearer token'
          tokens="${CLAUDE_CODE_OAUTH_TOKENS:-$CLAUDE_CODE_OAUTH_TOKEN}"
          unset CLAUDE_CODE_OAUTH_TOKENS # the agent's environment gets its own account's token only
          n=0
          while IFS= read -r token; do
            token="${token//[$'\r\t ']/}"
            [ -n "$token" ] || continue
            n=$((n + 1))
            [ "$n" = 1 ] || { git checkout -q -- . && git clean -qfd -e ISSUE.md; }
            CLAUDE_CODE_OAUTH_TOKEN="$token" claude -p --model "${FIX_MODEL:-opus}" --output-format json --tools 'Read,Edit,Write,Bash,Glob,Grep' --allowedTools 'Read,Edit,Write,Bash,Glob,Grep' \
              --setting-sources '' --strict-mcp-config --json-schema "$schema" < scripts/site-fix-prompt.md > /tmp/agent.json || true
            jq -e --arg out "$out" '.is_error and ((.result // "") | test($out; "i"))' /tmp/agent.json > /dev/null 2>&1 || break
            echo "Claude account $n is out of its limit or was rejected: the next one"
          done <<< "$tokens"
      - name: Turn the agent's work into a patch
        run: |
          mkdir -p /tmp/fix
          node -e 'let r={};try{r=JSON.parse(require("fs").readFileSync("/tmp/agent.json","utf8"))}catch{};const o=r.structured_output??{status:"needs-person",summary:"The agent did not finish: "+String(r.result??"no output").slice(0,500)};require("fs").writeFileSync("/tmp/fix/result.json",JSON.stringify(o));console.log(o.status+": "+o.summary)'
          rm -f ISSUE.md
          git add -A && git diff --cached --binary > /tmp/fix/fix.patch
          git diff --cached --stat
      - name: Hand the patch to the next jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fix
          path: /tmp/fix
  verify:
    name: Every check on the patch (no secrets)
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      ok: ${{ steps.checks.outputs.ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the patch
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fix
          path: /tmp/fix
      - id: apply
        name: Apply the patch
        run: |
          [ -s /tmp/fix/fix.patch ] || { echo "no change"; exit 0; }
          git apply --check /tmp/fix/fix.patch && git apply /tmp/fix/fix.patch && echo applied=1 >> "$GITHUB_OUTPUT"
      - name: Install Node, pnpm and the dependencies
        if: steps.apply.outputs.applied == '1'
        uses: ./.github/actions/setup
      - id: checks
        name: Unit tests, typecheck and browser checks
        if: steps.apply.outputs.applied == '1'
        run: |
          pnpm --filter site exec playwright install --with-deps chromium
          pnpm test && pnpm typecheck && pnpm --filter site e2e && echo ok=1 >> "$GITHUB_OUTPUT" || echo ok=0 >> "$GITHUB_OUTPUT"
  publish:
    name: Open the draft PR, or say why on the issue
    needs: [agent, verify]
    if: always() && needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write # starts ci.yml on the fix branch (a PR opened by this token starts no workflow)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the patch and the agent's result
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: fix
          path: /tmp/fix
      # The script as it is on main, copied before the patch touches the tree. No pnpm: nothing from the patch runs here.
      - name: Publish with main's script
        run: cp scripts/site-fix-publish.mjs /tmp/publish.mjs && node /tmp/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          OK: ${{ needs.verify.outputs.ok }}
