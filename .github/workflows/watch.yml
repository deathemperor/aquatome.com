name: Live site checks (after each deploy, nightly)
# Layer 2 of docs/governance.md: the browser checks against aquatome.com after every deploy and each night, a different
# sample of pages each day plus every page with an open problem. Problems become issues (label site-check) and close
# themselves once the check passes. A failed deploy opens one too (its run was started by the engine: nobody else hears).
on:
  workflow_run:
    workflows: ['Deploy aquatome.com'] # deploy.yml's name
    types: [completed]
  schedule:
    - cron: '0 22 * * *' # 05:00 in Vietnam
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
  actions: write # starts fix.yml for a new problem (layer 4)
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  deploy-failed:
    name: Open the "Deploy failed" issue
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open or update the issue
        run: node scripts/site-watch.mjs deploy-failed "$DEPLOY_RUN"
        env:
          DEPLOY_RUN: ${{ github.event.workflow_run.html_url }}
  # Check what is live with the checks of that version: the commit the deploy just shipped, else the last deploy that
  # succeeded. Main's newest checks against an older site fail on what isn't deployed yet. Found once for every job
  # below, so they all check out the same commit.
  live:
    name: Find the version that is live
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        name: The deploy's commit, else the last deploy that succeeded
        env:
          DEPLOYED: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=${DEPLOYED:-$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --status success --limit 1 --json headSha --jq '.[0].headSha')}" >> "$GITHUB_OUTPUT"
  checks:
    name: Browser checks on aquatome.com
    needs: live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.live.outputs.sha || github.sha }}
      - name: Install Node, pnpm and the dependencies
        uses: ./.github/actions/setup
      - name: Install Chromium for Playwright
        run: scripts/install-browser.sh chromium
      # The AI review (layer 3) runs at night and on demand, not after every deploy: it costs model time.
      # CLAUDE_ON_CI=off pauses it. Unset, or any other value, and it runs. The checks themselves still run.
      - name: Install Claude for the AI page review (nightly and by hand)
        if: github.event_name != 'workflow_run' && vars.CLAUDE_ON_CI != 'off'
        run: npm install -g @anthropic-ai/claude-code && echo E2E_REVIEW=1 >> "$GITHUB_ENV"
      - name: List the sitemap's pages and the pages of open issues
        run: node scripts/site-watch.mjs prepare https://aquatome.com apps/site
      # After a deploy, and while Claude is paused: the same checks, and no token, so nothing tries to review.
      - name: Browser checks, today's sample of pages
        if: github.event_name == 'workflow_run' || vars.CLAUDE_ON_CI == 'off'
        working-directory: apps/site
        run: E2E_SEED=$((10#$(date -u +%j))) pnpm e2e
        env:
          E2E_BASE_URL: https://aquatome.com
          E2E_PAGES: e2e-pages.json
          E2E_RECHECK: e2e-recheck.json
          E2E_JSON: e2e-results.json
          E2E_REVIEW: ''
      # The nightly review has a line in the engine's daily ceilings (packages/engine/src/ceilings.json, GitHub's side).
      # What is left of its day is counted from the cost lines its earlier runs kept. No model, no token of Claude's.
      # If the day can't be counted, the review says so and does not run.
      - id: left
        name: What the nightly review has left of its day
        if: github.event_name != 'workflow_run'
        continue-on-error: true
        run: node scripts/claude-spend.mjs left nightly-review
      - name: Browser checks, today's sample of pages, with the AI review
        if: github.event_name != 'workflow_run' && vars.CLAUDE_ON_CI != 'off'
        working-directory: apps/site
        run: E2E_SEED=$((10#$(date -u +%j))) pnpm e2e
        env:
          E2E_BASE_URL: https://aquatome.com
          E2E_PAGES: e2e-pages.json
          E2E_RECHECK: e2e-recheck.json
          E2E_JSON: e2e-results.json
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The owner's other Claude accounts, one token a line: the next when one is out (claude-accounts.ts).
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
          # A line a call, and no call once this run has spent what was left (claude-accounts.ts).
          CLAUDE_COST_STEP: nightly-review
          CLAUDE_COST_LOG: ${{ runner.temp }}/aquatome-cost-nightly-review.jsonl
          CLAUDE_SPEND_LEFT: ${{ steps.left.outputs.left }}
      # Kept with the run: later runs count the day from these. A line has the time, the step, the account's hash, the
      # model, dollars and tokens, and nothing of a page, a prompt or an answer. Named by the run's attempt: a job run
      # again keeps the first attempt's lines too.
      - name: Keep the nightly review's cost lines
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cost-log-nightly-review-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aquatome-cost-nightly-review.jsonl
          if-no-files-found: ignore
      - name: Hand the results to the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-checks
          path: apps/site/e2e-results.json
          if-no-files-found: ignore
      - name: Keep the browser checks' report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: apps/site/e2e-report
          if-no-files-found: ignore
  # Lighthouse on the live pages, ads and all (what PageSpeed Insights measures), on a runner of its own: next to the
  # other checks its timings would measure them.
  lighthouse:
    name: Lighthouse on aquatome.com
    needs: live
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.live.outputs.sha || github.sha }}
      - name: Install Node, pnpm and the dependencies
        uses: ./.github/actions/setup
      - name: Install Chromium for Playwright
        run: scripts/install-browser.sh chromium
      - name: List the sitemap's pages
        run: node scripts/site-watch.mjs prepare https://aquatome.com apps/site
      - name: Lighthouse, one page at a time
        working-directory: apps/site
        run: pnpm e2e --grep @lighthouse --workers=1
        env:
          E2E_LIGHTHOUSE: '1'
          E2E_BASE_URL: https://aquatome.com
          E2E_PAGES: e2e-pages.json
          E2E_JSON: lighthouse-results.json
      - name: Hand the results to the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-lighthouse
          path: apps/site/lighthouse-results.json
          if-no-files-found: ignore
      - name: Keep Lighthouse's report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report
          path: apps/site/e2e-report
          if-no-files-found: ignore
  # One report for both: results missing from either open "Site checks did not run", and a run hands at most 3 new
  # problems to fix.yml.
  report:
    name: Open, update and close issues
    needs: [live, checks, lighthouse]
    if: always() && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.live.outputs.sha || github.sha }}
      - name: Close the "Deploy failed" issue
        if: github.event_name == 'workflow_run'
        run: node scripts/site-watch.mjs deploy-ok "$DEPLOY_RUN"
        env:
          DEPLOY_RUN: ${{ github.event.workflow_run.html_url }}
      - name: Fetch both jobs' results
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: results-*
          merge-multiple: true
          path: apps/site
      - name: Turn the results into issues
        run: node scripts/site-watch.mjs report apps/site/e2e-results.json,apps/site/lighthouse-results.json "$RUN_URL"
