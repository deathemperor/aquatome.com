name: watch
# Layer 2 of docs/governance.md: the browser checks against aquatome.com after every deploy and each night, a different
# sample of pages each day plus every page with an open problem. Problems become issues (label site-check) and close
# themselves once the check passes. A failed deploy opens one too (its run was started by the engine: nobody else hears).
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
  schedule:
    - cron: '0 22 * * *' # 05:00 in Vietnam
  workflow_dispatch:
concurrency:
  group: watch
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
  actions: write # starts fix.yml for a new problem (layer 4)
jobs:
  deploy-failed:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node scripts/site-watch.mjs deploy-failed "$DEPLOY_RUN"
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN: ${{ github.event.workflow_run.html_url }}
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Check what is live with the checks of that version: the commit the deploy just shipped, else the last deploy
      # that succeeded. Main's newest checks against an older site fail on what isn't deployed yet.
      - id: live
        if: github.event_name != 'workflow_run'
        run: echo "sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy --status success --limit 1 --json headSha --jq '.[0].headSha')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || steps.live.outputs.sha || github.sha }}
      - uses: ./.github/actions/setup
      - if: github.event_name == 'workflow_run'
        run: node scripts/site-watch.mjs deploy-ok "$DEPLOY_RUN"
        env:
          DEPLOY_RUN: ${{ github.event.workflow_run.html_url }}
      - run: pnpm --filter site exec playwright install --with-deps chromium
      # The AI review (layer 3) runs at night and on demand, not after every deploy: it costs model time.
      - if: github.event_name != 'workflow_run'
        run: npm install -g @anthropic-ai/claude-code && echo E2E_REVIEW=1 >> "$GITHUB_ENV"
      - run: node scripts/site-watch.mjs prepare https://aquatome.com apps/site
      - name: checks
        working-directory: apps/site
        run: E2E_SEED=$((10#$(date -u +%j))) pnpm e2e
        env:
          E2E_BASE_URL: https://aquatome.com
          E2E_PAGES: e2e-pages.json
          E2E_RECHECK: e2e-recheck.json
          E2E_JSON: e2e-results.json
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Lighthouse on the live pages, ads and all (what PageSpeed Insights measures), alone after the other checks.
      - name: lighthouse
        if: ${{ !cancelled() }}
        working-directory: apps/site
        run: pnpm e2e --grep @lighthouse --workers=1
        env:
          E2E_LIGHTHOUSE: '1'
          E2E_BASE_URL: https://aquatome.com
          E2E_PAGES: e2e-pages.json
          E2E_JSON: lighthouse-results.json
      - if: always()
        run: node scripts/site-watch.mjs report apps/site/e2e-results.json,apps/site/lighthouse-results.json "$RUN_URL"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: apps/site/e2e-report
          if-no-files-found: ignore
