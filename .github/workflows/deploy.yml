name: deploy
# Merges to main go live. The engine's own pushes (GITHUB_TOKEN) don't trigger this; engine.yml deploys itself.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/schema/**', 'content/**', 'pnpm-lock.yaml']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/engine-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - run: pnpm test
      - run: scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
