name: deploy
# Merges to main go live, and the engine's pushes (over its deploy key, engine.yml) the same way.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/schema/**', 'content/**', 'pnpm-lock.yaml']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/engine-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - run: pnpm test
      # The same browser checks as ci.yml, here too: engine content reaches this workflow without a pull request.
      - run: pnpm --filter site exec playwright install --with-deps chromium
      - run: pnpm --filter site e2e
      - run: scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # deploy.sh checks a fixed sample of the real pages in a browser before uploading them.
          E2E_GATE: '1'
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: apps/site/e2e-report
          if-no-files-found: ignore
