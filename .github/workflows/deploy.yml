name: Deploy aquatome.com
# Merges to main go live, and the engine's pushes (over its deploy key, engine.yml) the same way. watch.yml starts after
# each run by this name: rename both together.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/schema/**', 'content/**', 'pnpm-lock.yaml']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: Test, build, check in a browser, upload
    runs-on: ubuntu-latest
    # The job's limit is only a backstop: over it, GitHub calls the run cancelled and nothing reports it. The step's own limit
    # below fails the run, and a failed run is reported.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node, pnpm and the dependencies
        uses: ./.github/actions/setup
      - name: Claude CLI, the engine's config files, git identity
        uses: ./.github/actions/engine-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      # Some engine tests read content/, which the engine's pushes change. The fixture build's browser checks run in
      # ci.yml (every PR, and main): the fixture doesn't read content/, and deploy.sh checks the real pages below.
      - name: Unit tests
        run: pnpm test
      - name: Install Chromium for the browser checks before upload
        run: pnpm --filter site exec playwright install --with-deps chromium
      - name: Build the real site, check it in a browser, upload it to Cloudflare
        timeout-minutes: 45
        run: scripts/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # deploy.sh checks a fixed sample of the real pages in a browser before uploading them.
          E2E_GATE: '1'
      - name: Keep the browser checks' report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: apps/site/e2e-report
          if-no-files-found: ignore
