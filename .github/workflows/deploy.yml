name: deploy
# Merges to main go live. The engine's own pushes (GITHUB_TOKEN) don't trigger this; engine.yml deploys itself.
on:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/schema/**', 'content/**', 'pnpm-lock.yaml']
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
      CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          engine: 'true'
      - run: pnpm test
      - run: scripts/deploy.sh
