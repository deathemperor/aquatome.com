name: 'Engine: content cycle every 3 h'
# The content engine's rewrite part, every 3 hours (scripts/engine-cycle.sh rewrite): older Vietnamese rewritten, Indonesian
# and Thai pages. It needs only the model. The other three parts (pages, sf, photos) need macOS, as face screening uses
# Apple's Vision framework and the page fetcher drives a real (headed) Chrome: they run on the owner's Mac
# (scripts/install-engine-schedule.sh), as they held 3 of GitHub's 5 macOS runners for hours and the iOS app's jobs queued.
on:
  schedule:
    # Hourly, though a cycle runs every 3 hours: GitHub delays or drops scheduled runs when busy (on 2 November only 3
    # of the 8 three-hourly ones started, up to an hour late). Job `due` lets a scheduled run through only when no
    # cycle started in the last 2 h 50 min, so the cycle keeps its pace even when most of these are dropped.
    - cron: '23 * * * *'
  workflow_dispatch:
concurrency:
  group: engine
  cancel-in-progress: false
permissions:
  contents: write
  actions: write # the cycle starts deploy.yml
jobs:
  due:
    name: 'Is a cycle due?'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      # A cycle is a run that went on for over 10 minutes or is still going; the hourly checks that found none due end
      # in seconds. A run started by hand always goes.
      - id: due
        name: Started by hand, or 2 h 50 min since the last cycle started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w engine.yml -L 30 --json databaseId,createdAt,updatedAt,status \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.status != \"completed\" or ((.updatedAt | fromdateiso8601) - (.createdAt | fromdateiso8601)) > 600) | .createdAt | fromdateiso8601] | max // 0")
          age=$(( $(date -u +%s) - last ))
          echo "last cycle started $((age / 60)) min ago"
          if [ "$age" -ge $((170 * 60)) ]; then echo run=true >> "$GITHUB_OUTPUT"; else echo run=false >> "$GITHUB_OUTPUT"; fi
  cycle:
    needs: due
    if: needs.due.outputs.run == 'true'
    name: 'Content cycle: rewrite'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Pushes to main go over this deploy key: main's ruleset lets deploy keys (and admins) push straight to it,
          # GitHub Actions' own token can't be let through on a personal repo. Its pushes start deploy.yml themselves.
          ssh-key: ${{ secrets.ENGINE_DEPLOY_KEY }}
      - name: Install Node, pnpm and the dependencies
        uses: ./.github/actions/setup
      - name: Claude CLI, the engine's config files, git identity
        uses: ./.github/actions/engine-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - name: Run this part, test, commit, push, deploy
        run: scripts/engine-cycle.sh rewrite
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The owner's other Claude accounts, one token a line: the next when one is out (claude-accounts.ts).
          CLAUDE_CODE_OAUTH_TOKENS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS }}
      - name: Keep the test log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-test-log-rewrite
          path: /tmp/thuysinh-engine-test-rewrite.log
          if-no-files-found: ignore
