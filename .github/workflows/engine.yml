name: engine
# The content engine, every 3 hours (was launchd on the owner's Mac, 6-hourly with twice the page time). macOS: face screening uses Apple's Vision
# framework, and the page fetcher drives a real (headed) Chrome. Four parallel jobs (scripts/engine-cycle.sh <part>), each
# testing, committing and deploying its own content, so a failure in one loses only that part's work.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      engine_args:
        description: 'Extra args for `pnpm engine run` (e.g. --sources scotcat --limit 2); set = a short run (pages job only) without the video/photo steps'
        default: ''
      max_minutes:
        description: 'Minutes for page processing'
        default: '150'
concurrency:
  group: engine
  cancel-in-progress: false
permissions:
  contents: write
  actions: write # each job starts deploy.yml
jobs:
  cycle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: pages
            os: macos-latest
          # Seriously Fish's backlog, beside the other sources instead of sharing the pages job's time with them.
          - part: sf
            os: macos-latest
          - part: photos
            os: macos-latest
          # Only the model: no Chrome, no Vision.
          - part: rewrite
            os: ubuntu-latest
    name: ${{ matrix.part }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 355
    env:
      ENGINE_ARGS: ${{ inputs.engine_args }}
      ENGINE_MAX_MINUTES: ${{ inputs.max_minutes || '150' }}
      # YouTube throttles GitHub's IPs: the video steps run on the owner's Mac (scripts/video-cycle.sh).
      SKIP_VIDEOS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/engine-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      - if: runner.os == 'macOS'
        run: brew install yt-dlp
      - run: scripts/engine-cycle.sh ${{ matrix.part }}
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Videos on species pages (YouTube Data API search, 10,000 units/day).
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Gallery photos from Unsplash (demo key: 50 requests an hour).
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-test-log-${{ matrix.part }}
          path: /tmp/thuysinh-engine-test.log
          if-no-files-found: ignore
