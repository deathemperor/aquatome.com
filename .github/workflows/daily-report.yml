name: Daily report to the owner
# Every morning: what needs care, highlights, what was built, and the site's and the app's numbers, mailed to the owner and
# kept on the dashboard (/_ab/bao-cao/). This job reads the last 24 hours from GitHub with its read-only token
# (scripts/daily-report.mjs); the Worker adds the rest, stores the report and sends it (apps/site/worker/daily).
#
# 07:00 in Vietnam comes from this Mac, which starts this job at 06:58 (scripts/install-daily-report-schedule.sh): GitHub's
# schedule ran it about 5 hours late on each day of 6 to 9 Nov 2026. The cron stays as the backstop for a morning the Mac
# didn't start it, and makes no report once one has succeeded that day (daily-report.mjs, reportedToday).
on:
  schedule:
    - cron: '20 1 * * *' # 08:20 in Vietnam, after the Mac's start and away from the top of the hour, GitHub's busiest
  workflow_dispatch:
concurrency:
  group: daily-report
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
jobs:
  report:
    name: Collect the last 24 hours and post them to the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Collect and post
        run: node scripts/daily-report.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          AB_DASH_TOKEN: ${{ secrets.AB_DASH_TOKEN }}
