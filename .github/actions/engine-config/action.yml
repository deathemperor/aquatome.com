name: engine-config
description: Claude CLI, the owner's ~/.config/aquatome files the scripts read (from this step's env), git identity. No third-party code.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Pinned (the chief of staff, 2026-11-11): the reviewers' scores moved with the command's six releases of 3-10 Nov,
        # and a run installed whichever was newest. To move the pin: a PR changing this one version, saying why; before it
        # merges, 20 saved pages are read on both versions (40 reads, about $1), and it merges if their scores move by under
        # 0.05 on average, else the chief of staff decides. Every call and review logs the version it ran on (claude.ts).
        npm install -g @anthropic-ai/claude-code@2.1.322
        umask 077 && mkdir -p ~/.config/aquatome
        printf '%s' "$CLOUDFLARE_API_TOKEN" > ~/.config/aquatome/cf-token
        printf '%s' "$AB_DASH_TOKEN" > ~/.config/aquatome/ab-dash-token
        printf '%s' "$CF_ACCOUNT_ID" > ~/.config/aquatome/cf-account
        git config user.name 'aquatome-engine'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
